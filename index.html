<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMDb Explorer - LO's Media</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- HLS.js for raw stream playing (Channels only) -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <!-- Plyr Video Player -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        imdb: '#f5c518',
                        darkBg: '#0a0a0f',
                        surface: '#1a1a24'
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            background-color: #0a0a0f;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .glass {
            background: rgba(26, 26, 36, 0.7);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .modal-glass {
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(16px);
        }
        .movie-card {
            transition: all 0.3s ease;
        }
        .movie-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.5);
            border-color: rgba(245, 197, 24, 0.5);
        }
        .tab-active {
            color: #f5c518;
            border-bottom: 2px solid #f5c518;
        }
        .tab-inactive {
            color: #a0a0b0;
            border-bottom: 2px solid transparent;
        }
        .tab-inactive:hover {
            color: white;
        }
        
        .lang-switch {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 4px;
            display: flex;
            cursor: pointer;
            position: relative;
        }
        .lang-option {
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 0.875rem;
            font-weight: 600;
            z-index: 1;
            transition: color 0.3s;
        }
        .lang-active-bg {
            position: absolute;
            top: 4px;
            bottom: 4px;
            background: #f5c518;
            border-radius: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #f5c518;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
    <script>
        // Anti-DevTools Protection
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.keyCode === 123 || 
               (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) ||
               (e.ctrlKey && e.keyCode === 85)) {
                e.preventDefault();
            }
        });
        setInterval(() => {
            const before = new Date().getTime();
            debugger;
            if (new Date().getTime() - before > 100) {
                document.body.innerHTML = 'Restricted area.';
            }
        }, 500);
    </script>
</head>
<body dir="ltr">
    <div id="root"></div>

    <script type="text/babel">
        const TMDB_API_KEY = '04c35731a5ee918f014970082a0088b1';
        const TMDB_BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_BASE_URL = 'https://image.tmdb.org/t/p/w500';

        const dict = {
            en: {
                title: 'IMDb Explorer',
                searchPlaceholder: 'Search movies, series, anime, channels...',
                movies: 'Movies',
                series: 'TV Series',
                anime: 'Anime',
                channels: 'Live Channels',
                searchResults: 'Search Results',
                topRated: 'Trending',
                noResults: 'No media found',
                trailer: 'Play',
                loading: 'Loading more...',
                director: 'Director / Network',
                cast: 'Language',
                genre: 'Genre',
                runtime: 'Release',
                close: 'Close',
                backToDetails: 'Back to Details'
            },
            ku: {
                title: 'گەڕانی IMDb',
                searchPlaceholder: 'گەڕان بۆ فیلم، زنجیرە، ئەنیمێ، کەناڵ...',
                movies: 'فیلمەکان',
                series: 'زنجیرەکان',
                anime: 'ئەنیمێ',
                channels: 'کەناڵە ڕاستەوخۆکان',
                searchResults: 'ئەنجامەکانی گەڕان',
                topRated: 'باوترینەکان',
                noResults: 'هیچ نەدۆزرایەوە',
                trailer: 'لێدان',
                loading: 'زیاتر دادەبەزێت...',
                director: 'دەرهێنەر / کەناڵ',
                cast: 'زمان',
                genre: 'جۆر',
                runtime: 'بڵاوکردنەوە',
                close: 'داخستن',
                backToDetails: 'گەڕانەوە بۆ وردەکارییەکان'
            }
        };

        function App() {
            const [search, setSearch] = React.useState('');
            const [activeTab, setActiveTab] = React.useState('movie');
            const [lang, setLang] = React.useState('en');
            const [page, setPage] = React.useState(1);
            const [isLoading, setIsLoading] = React.useState(false);
            const [selectedMedia, setSelectedMedia] = React.useState(null);
            const [showTrailer, setShowTrailer] = React.useState(false);
            const [tvDetails, setTvDetails] = React.useState(null);
            const [selectedSeason, setSelectedSeason] = React.useState(1);
            const [selectedEpisode, setSelectedEpisode] = React.useState(1);
            
            const videoRef = React.useRef(null);
            
            // Data states
            const [moviesData, setMoviesData] = React.useState([]);
            const [seriesData, setSeriesData] = React.useState([]);
            const [animeData, setAnimeData] = React.useState([]);
            const [channelsData, setChannelsData] = React.useState([]);
            
            const t = dict[lang];

            React.useEffect(() => {
                fetch('movies.json?t=' + new Date().getTime())
                    .then(res => res.json())
                    .then(data => {
                        if (Array.isArray(data)) {
                            setChannelsData(data.filter(d => d.type === 'channel'));
                        }
                    })
                    .catch(err => console.log('Failed to fetch channels'));
            }, []);

            const fetchTMDB = async (type, pageNum, query = '') => {
                setIsLoading(true);
                try {
                    let endpoint = '';
                    if (query) {
                        endpoint = type === 'movie' ? `/search/movie?query=${query}&page=${pageNum}` : `/search/tv?query=${query}&page=${pageNum}`;
                    } else {
                        if (type === 'movie') endpoint = `/trending/movie/week?page=${pageNum}`;
                        else if (type === 'series') endpoint = `/trending/tv/week?page=${pageNum}`;
                        else if (type === 'anime') endpoint = `/discover/tv?with_genres=16&page=${pageNum}`;
                    }
                    
                    const res = await fetch(`${TMDB_BASE_URL}${endpoint}&api_key=${TMDB_API_KEY}`);
                    const data = await res.json();
                    
                    const formatted = data.results.filter(i => i.poster_path).map(item => ({
                        id: item.id,
                        type: type,
                        title: item.title || item.name,
                        year: (item.release_date || item.first_air_date || 'N/A').substring(0,4),
                        fullDate: item.release_date || item.first_air_date || 'N/A',
                        rating: (item.vote_average || 0).toFixed(1),
                        poster: `${IMG_BASE_URL}${item.poster_path}`,
                        backdrop: item.backdrop_path ? `https://image.tmdb.org/t/p/original${item.backdrop_path}` : '',
                        plot: item.overview || 'No description available.',
                        language: (item.original_language || 'EN').toUpperCase(),
                        url: item.url
                    }));

                    if (pageNum === 1) {
                        if (type === 'movie') setMoviesData(formatted);
                        else if (type === 'series') setSeriesData(formatted);
                        else if (type === 'anime') setAnimeData(formatted);
                    } else {
                        if (type === 'movie') setMoviesData(p => [...p, ...formatted]);
                        else if (type === 'series') setSeriesData(p => [...p, ...formatted]);
                        else if (type === 'anime') setAnimeData(p => [...p, ...formatted]);
                    }
                } catch (err) {
                    console.error("TMDB Fetch Error:", err);
                }
                setIsLoading(false);
            };

            React.useEffect(() => {
                if (activeTab === 'channel') return;
                
                const timeoutId = setTimeout(() => {
                    setPage(1);
                    fetchTMDB(activeTab, 1, search);
                }, 500);
                
                return () => clearTimeout(timeoutId);
            }, [activeTab, search]);

            React.useEffect(() => {
                const handleScroll = () => {
                    if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
                        if (!isLoading && activeTab !== 'channel') {
                            const nextPage = page + 1;
                            setPage(nextPage);
                            fetchTMDB(activeTab, nextPage, search);
                        }
                    }
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, [isLoading, activeTab, page, search]);

            React.useEffect(() => {
                lucide.createIcons();
                document.body.dir = lang === 'ku' ? 'rtl' : 'ltr';
            }, [lang, activeTab, search, moviesData, seriesData, animeData, channelsData, selectedMedia, showTrailer]);

            React.useEffect(() => {
                let hls;
                let player;
                if (showTrailer && videoRef.current) {
                    if (selectedMedia.type === 'channel') {
                        player = new Plyr(videoRef.current, {
                            controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'captions', 'settings', 'pip', 'airplay', 'fullscreen'],
                            quality: { default: 720, options: [4320, 2880, 2160, 1440, 1080, 720, 576, 480, 360, 240] }
                        });
                        if (Hls.isSupported() && selectedMedia.url.includes('.m3u8')) {
                            hls = new Hls();
                            hls.loadSource(selectedMedia.url);
                            hls.attachMedia(videoRef.current);
                            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                                videoRef.current.play().catch(e => console.log("Autoplay blocked:", e));
                            });
                        } else if (videoRef.current.canPlayType('application/vnd.apple.mpegurl')) {
                            videoRef.current.src = selectedMedia.url;
                            videoRef.current.addEventListener('loadedmetadata', function() {
                                videoRef.current.play().catch(e => console.log("Autoplay blocked:", e));
                            });
                        } else {
                            videoRef.current.src = selectedMedia.url;
                            videoRef.current.play().catch(e => console.log("Autoplay blocked:", e));
                        }
                    }
                }
                return () => {
                    if (hls) hls.destroy();
                    if (player) player.destroy();
                };
            }, [showTrailer, selectedMedia]);

            const toggleLang = () => setLang(prev => prev === 'en' ? 'ku' : 'en');
            const closeMediaModal = () => { setSelectedMedia(null); setShowTrailer(false); };
            const [useVidzee, setUseVidzee] = React.useState(false);

            const handleMediaClick = async (item) => {
                setSelectedMedia({...item, loadingStream: true, imdb_id: null});
                setShowTrailer(true);
                setUseVidzee(false);
                
                try {
                    if (item.type === 'series' || item.type === 'anime') {
                        const res = await fetch(`${TMDB_BASE_URL}/tv/${item.id}?api_key=${TMDB_API_KEY}&external_source=imdb_id`);
                        const data = await res.json();
                        const validSeasons = data.seasons ? data.seasons.filter(s => s.season_number > 0) : [];
                        setTvDetails(validSeasons);
                        setSelectedSeason(validSeasons.length > 0 ? validSeasons[0].season_number : 1);
                        setSelectedEpisode(1);
                    } else {
                        setTvDetails(null);
                    }
                } catch(e) {}

                setTimeout(() => {
                    setSelectedMedia(prev => ({...prev, loadingStream: false}));
                }, 800);
            };

            const getIframeSrc = () => {
                if (!selectedMedia) return '';
                const isTv = selectedMedia.type === 'series' || selectedMedia.type === 'anime';
                if (useVidzee) {
                    return isTv 
                        ? `https://player.vidzee.wtf/embed/tv/${selectedMedia.id}/${selectedSeason}/${selectedEpisode}`
                        : `https://player.vidzee.wtf/embed/movie/${selectedMedia.id}`;
                }
                const base = isTv ? window.atob('aHR0cHM6Ly92aWRsaW5rLnByby90di8=') + selectedMedia.id + '/' + selectedSeason + '/' + selectedEpisode : window.atob('aHR0cHM6Ly92aWRsaW5rLnByby9tb3ZpZS8=') + selectedMedia.id;
                return base + '?primaryColor=f5c518&secondaryColor=1a1a1a&iconColor=f5c518&autoplay=false';
            };

            let currentData = [];
            if (activeTab === 'movie') currentData = moviesData;
            else if (activeTab === 'series') currentData = seriesData;
            else if (activeTab === 'anime') currentData = animeData;
            else if (activeTab === 'channel') {
                currentData = channelsData.filter(item => item.title.toLowerCase().includes(search.toLowerCase()));
            }

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="glass sticky top-0 z-40 px-8 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div className="flex items-center gap-2 text-imdb font-extrabold text-2xl">
                            <i data-lucide="film" className="w-8 h-8"></i>
                            <span>{t.title}</span>
                        </div>
                        
                        <div className="flex items-center bg-black/50 border border-white/10 rounded-lg px-4 py-2 w-full md:w-96 focus-within:border-imdb focus-within:ring-1 focus-within:ring-imdb transition-all">
                            <i data-lucide="search" className={`w-5 h-5 text-gray-400 ${lang === 'ku' ? 'ml-2' : 'mr-2'}`}></i>
                            <input 
                                type="text" 
                                placeholder={t.searchPlaceholder} 
                                className="bg-transparent text-white w-full outline-none"
                                value={search}
                                onChange={(e) => setSearch(e.target.value)}
                            />
                        </div>

                        <div className="lang-switch" onClick={toggleLang}>
                            <div className="lang-active-bg" style={{
                                left: lang === 'en' ? '4px' : '50%',
                                right: lang === 'en' ? '50%' : '4px',
                            }}></div>
                            <span className={`lang-option ${lang === 'en' ? 'text-black' : 'text-white'}`}>EN</span>
                            <span className={`lang-option ${lang === 'ku' ? 'text-black' : 'text-white'}`}>KU</span>
                        </div>
                    </header>

                    <main className="flex-1 w-full max-w-7xl mx-auto p-8 relative">
                        <div className="flex gap-8 border-b border-white/10 mb-8 font-semibold text-lg overflow-x-auto no-scrollbar">
                            <button className={`pb-4 px-2 whitespace-nowrap transition-colors ${activeTab === 'movie' ? 'tab-active' : 'tab-inactive'}`} onClick={() => { setActiveTab('movie'); setSearch(''); }}>{t.movies}</button>
                            <button className={`pb-4 px-2 whitespace-nowrap transition-colors ${activeTab === 'series' ? 'tab-active' : 'tab-inactive'}`} onClick={() => { setActiveTab('series'); setSearch(''); }}>{t.series}</button>
                            <button className={`pb-4 px-2 whitespace-nowrap transition-colors ${activeTab === 'anime' ? 'tab-active' : 'tab-inactive'}`} onClick={() => { setActiveTab('anime'); setSearch(''); }}>{t.anime}</button>
                            <button className={`pb-4 px-2 whitespace-nowrap transition-colors ${activeTab === 'channel' ? 'tab-active' : 'tab-inactive'}`} onClick={() => { setActiveTab('channel'); setSearch(''); }}>{t.channels}</button>
                        </div>

                        <h2 className="text-3xl font-bold mb-8 flex items-center gap-3">
                            <i data-lucide={search ? "search" : "trending-up"} className="text-imdb w-8 h-8"></i>
                            {search ? t.searchResults : `${t.topRated} ${activeTab === 'movie' ? t.movies : activeTab === 'series' ? t.series : activeTab === 'anime' ? t.anime : t.channels}`}
                        </h2>

                        {currentData.length === 0 && !isLoading ? (
                            <div className="text-center py-20 text-red-400">
                                <i data-lucide="alert-circle" className="w-16 h-16 mx-auto mb-4 opacity-50"></i>
                                <h3 className="text-xl">{t.noResults}</h3>
                            </div>
                        ) : (
                            <>
                                <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8 mb-8">
                                    {currentData.map((item, idx) => (
                                        <div key={item.id + '-' + idx} onClick={() => handleMediaClick(item)} className="movie-card bg-surface rounded-xl overflow-hidden border border-white/10 cursor-pointer">
                                            <div className="relative pt-[150%] bg-[#2a2a36]">
                                                <img src={item.poster} alt={item.title} loading="lazy" className="absolute top-0 left-0 w-full h-full object-cover" />
                                                <div className={`absolute top-3 ${lang === 'ku' ? 'left-3' : 'right-3'} bg-black/80 backdrop-blur-md px-2 py-1 rounded-md border border-white/10 flex items-center gap-1 text-imdb font-bold text-sm`}>
                                                    <i data-lucide="star" className="w-4 h-4 fill-imdb"></i>
                                                    {item.rating}
                                                </div>
                                            </div>
                                            <div className="p-4">
                                                <h3 className="font-semibold text-lg truncate mb-1" title={item.title}>{item.title}</h3>
                                                <div className="flex justify-between text-gray-400 text-sm">
                                                    <span>{item.year}</span>
                                                    <span className="flex items-center gap-1"><i data-lucide="play" className="w-3 h-3"></i> {t.trailer}</span>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                
                                {isLoading && (
                                    <div className="flex flex-col items-center justify-center py-8 text-imdb">
                                        <div className="spinner mb-2"></div>
                                        <span className="text-sm font-medium">{t.loading}</span>
                                    </div>
                                )}
                            </>
                        )}
                    </main>

                    {selectedMedia && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-black/90 backdrop-blur-md transition-opacity" onClick={closeMediaModal}></div>
                            <div className="relative w-full max-w-5xl min-h-[500px] max-h-[90vh] overflow-y-auto custom-scrollbar modal-glass rounded-2xl border border-white/10 shadow-2xl flex flex-col z-10 animate-[scaleIn_0.2s_ease-out]">
                                <button onClick={closeMediaModal} className={`absolute top-4 ${lang === 'ku' ? 'left-4' : 'right-4'} bg-black/50 hover:bg-imdb hover:text-black transition-colors rounded-full p-2 text-white z-20`}>
                                    <i data-lucide="x" className="w-6 h-6"></i>
                                </button>
                                {showTrailer ? (
                                    <div className="w-full h-[75vh] min-h-[500px] bg-black relative rounded-2xl overflow-hidden flex flex-col">
                                        <div className="bg-black/90 p-4 flex flex-col md:flex-row items-start md:items-center justify-between z-10 border-b border-white/10 gap-4">
                                            <div className="flex items-center gap-4">
                                                <button onClick={() => setShowTrailer(false)} className="flex items-center gap-2 hover:text-imdb transition-colors font-semibold">
                                                    <i data-lucide="arrow-left" className="w-5 h-5"></i>
                                                    {t.backToDetails}
                                                </button>
                                                <h3 className="font-bold text-lg truncate">{selectedMedia.title}</h3>
                                            </div>
                                            
                                            <div className="flex items-center gap-3 w-full md:w-auto">
                                                <button 
                                                    onClick={() => setUseVidzee(!useVidzee)}
                                                    className={`text-sm px-3 py-2 rounded-lg font-semibold transition-colors flex items-center gap-2 ${useVidzee ? 'bg-imdb text-black' : 'bg-[#1a1a24] text-white hover:bg-white/10 border border-white/20'}`}
                                                >
                                                    <i data-lucide="refresh-cw" className={`w-4 h-4 ${useVidzee ? 'animate-spin' : ''}`}></i>
                                                    {lang === 'ku' ? 'سێرڤەری یەدەگ' : 'Backup Server'}
                                                </button>
                                                {tvDetails && (
                                                    <>
                                                        <select 
                                                            className="bg-[#1a1a24] border border-white/20 text-white text-sm rounded-lg focus:ring-imdb focus:border-imdb block w-full p-2.5"
                                                            value={selectedSeason}
                                                            onChange={(e) => {
                                                                setSelectedSeason(Number(e.target.value));
                                                                setSelectedEpisode(1);
                                                            }}
                                                        >
                                                            {tvDetails.map(s => (
                                                                <option key={s.season_number} value={s.season_number}>Season {s.season_number}</option>
                                                            ))}
                                                        </select>
                                                        <select 
                                                            className="bg-[#1a1a24] border border-white/20 text-white text-sm rounded-lg focus:ring-imdb focus:border-imdb block w-full p-2.5"
                                                            value={selectedEpisode}
                                                            onChange={(e) => setSelectedEpisode(Number(e.target.value))}
                                                        >
                                                            {Array.from({length: (tvDetails.find(s => s.season_number === selectedSeason) || {episode_count: 1}).episode_count}, (_, i) => i + 1).map(ep => (
                                                                <option key={ep} value={ep}>Episode {ep}</option>
                                                            ))}
                                                        </select>
                                                    </>
                                                )}
                                            </div>
                                        </div>
                                        <div className="aspect-video bg-black rounded-lg overflow-hidden relative shadow-2xl border border-white/10 group flex-1 w-full">
                                            {selectedMedia.loadingStream ? (
                                                <div className="absolute inset-0 flex flex-col items-center justify-center bg-black/90 z-50">
                                                    <div className="w-16 h-16 border-4 border-yellow-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                                                    <div className="text-yellow-400 text-lg font-bold animate-pulse">Initializing Custom Player...</div>
                                                </div>
                                            ) : (
                                                (selectedMedia.type === 'channel' || (selectedMedia.streamData && selectedMedia.streamData.is_raw_m3u8)) ? (
                                                    <video ref={videoRef} className="w-full h-full absolute inset-0 object-cover" controls autoPlay crossOrigin="anonymous"></video>
                                                ) : (
                                                    <>
                                                        <iframe 
                                                            src={getIframeSrc()} 
                                                            className="w-full h-full absolute inset-0 border-0" 
                                                            allowFullScreen 
                                                            allow="autoplay; encrypted-media"
                                                            sandbox="allow-same-origin allow-scripts allow-forms"
                                                        ></iframe>
                                                        {/* Custom Branding Overlay to hide third-party feeling */}
                                                        <div className="absolute top-0 left-0 w-full p-4 pointer-events-none bg-gradient-to-b from-black/80 to-transparent z-10 flex justify-between items-start">
                                                            <div className="flex items-center gap-2 opacity-80">
                                                                <div className="bg-imdb text-black px-2 py-0.5 rounded font-black text-xs uppercase tracking-wider">sebar tv player</div>
                                                                <span className="text-white/70 text-xs font-semibold drop-shadow-md">{selectedMedia.title}</span>
                                                            </div>
                                                        </div>
                                                    </>
                                                )
                                            )}
                                        </div>
                                    </div>
                                ) : (
                                    <div className="flex flex-col md:flex-row w-full relative">
                                        {/* Backdrop blurred background */}
                                        {selectedMedia.backdrop && (
                                            <div className="absolute inset-0 z-0 opacity-20">
                                                <img src={selectedMedia.backdrop} className="w-full h-full object-cover" />
                                                <div className="absolute inset-0 bg-gradient-to-t from-[#0a0a0f] via-transparent to-transparent"></div>
                                            </div>
                                        )}
                                        
                                        <div className="w-full md:w-1/3 p-6 z-10 flex justify-center items-start">
                                            <img src={selectedMedia.poster} alt={selectedMedia.title} className="w-full max-w-[300px] rounded-xl shadow-2xl border border-white/20" />
                                        </div>

                                        <div className="w-full md:w-2/3 p-6 md:p-10 z-10 flex flex-col justify-center">
                                            <div className="flex items-center gap-3 mb-3">
                                                <span className="bg-imdb text-black font-extrabold px-3 py-1 rounded-md text-sm">{selectedMedia.year}</span>
                                                <div className="flex items-center gap-1 text-imdb font-bold text-lg bg-black/50 px-3 py-1 rounded-md">
                                                    <i data-lucide="star" className="w-5 h-5 fill-imdb"></i>
                                                    {selectedMedia.rating} / 10
                                                </div>
                                                <span className="border border-white/20 uppercase text-xs font-bold px-3 py-1 rounded-md">{selectedMedia.type}</span>
                                            </div>
                                            
                                            <h2 className="text-4xl md:text-5xl font-black mb-6 leading-tight drop-shadow-lg">{selectedMedia.title}</h2>
                                            
                                            <p className="text-gray-200 text-lg leading-relaxed mb-8 bg-black/40 p-4 rounded-xl backdrop-blur-sm border border-white/5">
                                                {selectedMedia.plot}
                                            </p>
                                            
                                            <div className="grid grid-cols-2 gap-6 text-sm mb-8 bg-black/30 p-4 rounded-xl">
                                                <div>
                                                    <h4 className="text-gray-400 uppercase font-bold mb-1 tracking-wider text-xs">{t.runtime}</h4>
                                                    <p className="font-medium text-white">{selectedMedia.fullDate || 'Live'}</p>
                                                </div>
                                                <div>
                                                    <h4 className="text-gray-400 uppercase font-bold mb-1 tracking-wider text-xs">{t.cast}</h4>
                                                    <p className="font-medium text-white">{selectedMedia.language || 'Multiple'}</p>
                                                </div>
                                            </div>

                                            <button 
                                                onClick={() => setShowTrailer(true)}
                                                className="bg-imdb text-black font-extrabold py-4 px-10 rounded-xl flex items-center justify-center gap-3 hover:bg-yellow-400 transition-all hover:scale-105 w-full md:w-auto shadow-[0_0_20px_rgba(245,197,24,0.4)] text-xl"
                                            >
                                                <i data-lucide="play-circle" className="w-8 h-8 fill-black"></i>
                                                {t.trailer}
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                    <style dangerouslySetInnerHTML={{__html: `
                        @keyframes scaleIn {
                            from { opacity: 0; transform: scale(0.95); }
                            to { opacity: 1; transform: scale(1); }
                        }
                    `}} />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
